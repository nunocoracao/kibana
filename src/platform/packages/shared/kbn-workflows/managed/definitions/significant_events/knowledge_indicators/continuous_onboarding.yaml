# A scheduler for one space-wide, tool-only knowledge exploration agent.
version: '1'
name: 'Knowledge Exploration'
enabled: false
description: 'Runs the knowledge exploration agent on its configured schedule. The agent checks novelty before exploring.'
tags:
  - observability
  - significant-events
  - knowledge-indicators
settings:
  timeout: '12m'
  concurrency:
    key: significant-events-continuous-ki-onboarding
    strategy: drop
    max: 1
triggers:
  - type: scheduled
    with:
      every: '__EXPLORATION_INTERVAL_MINUTES__m'
  - type: manual
steps:
  - name: explore_knowledge
    type: kibana.request
    with:
      method: POST
      path: '/s/{{ workflow.spaceId }}/internal/significant_events/knowledge_exploration/_run_sync'
      headers:
        x-elastic-internal-origin: 'kibana'
